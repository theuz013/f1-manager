<!-- F1 Manager Persistence Layer -->
<script>
(function(){
  'use strict';
  const DB_NAME='f1m_persist';
  const DB_VER=1;
  const STORE='kv';
  const GAME_KEY='box-save-v5';
  const OLD_KEYS=['box-save-v3','box-save-v4'];
  const SOUND_KEYS=['box-sound','box-audio'];

  // Open IndexedDB
  let db=null;
  function openDB(){
    return new Promise((res,rej)=>{
      try{
        const req=indexedDB.open(DB_NAME,DB_VER);
        req.onupgradeneeded=e=>{
          const d=e.target.result;
          if(!d.objectStoreNames.contains(STORE))d.createObjectStore(STORE);
        };
        req.onsuccess=e=>{db=e.target.result;res(db);};
        req.onerror=e=>rej(e);
      }catch(e){rej(e);}
    });
  }

  function idbGet(key){
    return new Promise((res,rej)=>{
      if(!db){res(null);return;}
      try{
        const tx=db.transaction(STORE,'readonly');
        const req=tx.objectStore(STORE).get(key);
        req.onsuccess=e=>res(e.target.result??null);
        req.onerror=e=>rej(e);
      }catch(e){res(null);}
    });
  }

  function idbSet(key,val){
    return new Promise((res,rej)=>{
      if(!db){res();return;}
      try{
        const tx=db.transaction(STORE,'readwrite');
        tx.objectStore(STORE).put(val,key);
        tx.oncomplete=()=>res();
        tx.onerror=e=>rej(e);
      }catch(e){res();}
    });
  }

  function idbDel(key){
    return new Promise((res)=>{
      if(!db){res();return;}
      try{
        const tx=db.transaction(STORE,'readwrite');
        tx.objectStore(STORE).delete(key);
        tx.oncomplete=()=>res();
        tx.onerror=()=>res();
      }catch(e){res();}
    });
  }

  // Patch localStorage so every write is mirrored to IndexedDB
  const _lsSet=localStorage.setItem.bind(localStorage);
  const _lsGet=localStorage.getItem.bind(localStorage);
  const _lsDel=localStorage.removeItem.bind(localStorage);

  localStorage.setItem=function(k,v){
    try{_lsSet(k,v);}catch(e){}
    idbSet(k,v).catch(()=>{});
  };
  localStorage.removeItem=function(k){
    try{_lsDel(k);}catch(e){}
    idbDel(k).catch(()=>{});
  };

  // On init: restore from IndexedDB → localStorage (handles PWA standalone where LS is empty)
  async function restoreFromIDB(){
    try{
      await openDB();
      const allKeys=[GAME_KEY,...OLD_KEYS,...SOUND_KEYS];
      for(const k of allKeys){
        const v=await idbGet(k);
        if(v!==null){
          try{
            const cur=_lsGet(k);
            if(!cur)_lsSet(k,v);
          }catch(e){try{_lsSet(k,v);}catch(e2){}}
        }
      }
      // Also push current LS values to IDB (in case IDB was empty)
      try{
        const cur=_lsGet(GAME_KEY);
        if(cur)await idbSet(GAME_KEY,cur);
      }catch(e){}
    }catch(e){}
  }

  // Eagerly save on visibility change and beforeunload
  function forceSave(){
    try{
      const v=_lsGet(GAME_KEY);
      if(v)idbSet(GAME_KEY,v).catch(()=>{});
    }catch(e){}
  }
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')forceSave();});
  window.addEventListener('beforeunload',forceSave);
  window.addEventListener('pagehide',forceSave);

  // Run restore before React boots
  restoreFromIDB();
})();
</script>

 #tab-groups button{flex:0 0 auto;font-family:var(--display,"Barlow Condensed"),sans-serif;font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:.85rem;padding:6px 12px;border-radius:999px;border:1px solid #273640;background:transparent;color:#b0bfc9;cursor:pointer}
 #tab-groups button.on{background:#00d26a;border-color:#00d26a;color:#06110b}
 nav.tabs.grouped button.tab-off{display:none!important}

.compat-ok{background:#1a3a1a;color:#4caf50}
.compat-warn{background:#3a2e00;color:#ffc107}
.compat-bad{background:#3a0f0f;color:#f44336}

<div id="tip-box" role="dialog" aria-live="polite"><h4 id="tip-title"></h4><p id="tip-text"></p><div class="tip-row"><button id="tip-skip">Pular todas as dicas</button><button id="tip-ok">Entendi</button></div></div>
<script>
(function(){
'use strict';
var KEY='f1fun-tips-v1';
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){return {}}}
function save(o){try{localStorage.setItem(KEY,JSON.stringify(o))}catch(e){}}
var seen=load(),queue=[],showing=null;
var TIPS=[
 {id:'boas-vindas',title:'Bem-vindo à sede',text:'Antes de cada GP você prepara a equipe aqui: carro, P&D, pilotos e finanças. Quando estiver pronto, clique em “Viajar” para o fim de semana de corrida.',test:function(t){return /Viajar para o GP/i.test(t)}},
 {id:'fim-de-semana',title:'Fim de semana de corrida',text:'No treino você acerta o carro ouvindo o feedback dos pilotos. Depois vêm a classificação e a estratégia. Durante a corrida, o rádio mostra o que está acontecendo.',test:function(t){return /Ir para a classificação/i.test(t)}},
 {id:'evento',title:'Decisões antes da corrida',text:'Às vezes surge uma decisão: patrocinador, imprensa, peça, funcionário. Cada escolha tem custo e consequência. Leia a dica de cada botão antes de clicar.',test:function(t){return /Decisão antes da corrida/i.test(t)}},
 {id:'conflito',title:'Duas estrelas na mesma garagem',text:'Pilotos de ponta brigam por prioridade. Favorecer sempre o mesmo aumenta a tensão e pode virar ultimato. Alternar ou pagar uma reunião acalma a garagem. Veja a tensão na aba Equipe.',test:function(t){return /Duas estrelas, um carro na frente|Ultimato no box/i.test(t)}},
 {id:'rivalidade',title:'Rixas no paddock',text:'Seus pilotos podem criar rivalidades com pilotos de outras equipes. Quanto mais quente a rixa, maior a chance de toques na pista. A temperatura aparece na aba Equipe.',test:function(t){return /Rixa no paddock|Rivalidade explosiva/i.test(t)}},
 {id:'mercado',title:'Mercado é negociação',text:'Contratar é negociar: o piloto tem uma pedida e às vezes já tem proposta de outra equipe. Você tem 3 tentativas. Também dá para tirar pilotos de rivais pagando a multa rescisória.',test:function(t){return /Mercado de pilotos/i.test(t)&&/Tentar contratar de uma equipe rival|Negociação:/i.test(t)}},
 {id:'financas',title:'Fique de olho no caixa',text:'O card “Saúde financeira” compara com a temporada anterior e projeta o fim do ano. Caixa negativo derruba a confiança da diretoria a cada GP.',test:function(t){return /Saúde financeira/i.test(t)}},
 {id:'diretoria',title:'A diretoria observa',text:'A confiança sobe quando a equipe vai acima da meta e cai abaixo dela. A meta depende do tamanho da equipe e da força do carro.',test:function(t){return /Confiança da diretoria/i.test(t)&&/Carreira de/i.test(t)}},
 {id:'fim-temporada',title:'Fim de temporada',text:'Aqui chegam as propostas: de outras equipes para você e de rivais pelos seus pilotos. Igualar o salário segura o piloto. Na virada do ano, os pilotos evoluem ou envelhecem.',test:function(t){return /Balanço da temporada/i.test(t)}}
];
var box=document.getElementById('tip-box');
function show(t){showing=t;document.getElementById('tip-title').textContent=t.title;document.getElementById('tip-text').textContent=t.text;box.classList.add('show')}
function next(){if(showing||!queue.length)return;show(queue.shift())}
document.getElementById('tip-ok').addEventListener('click',function(){if(showing){seen[showing.id]=1;save(seen)}showing=null;box.classList.remove('show');setTimeout(next,400)});
document.getElementById('tip-skip').addEventListener('click',function(){seen.__off=1;save(seen);queue=[];showing=null;box.classList.remove('show')});
function scanTips(){if(seen.__off)return;var root=document.getElementById('root');if(!root||document.querySelector('.newgame'))return;
 var txt=root.innerText||'';TIPS.forEach(function(t){if(!seen[t.id]&&(!showing||showing.id!==t.id)&&queue.indexOf(t)<0&&t.test(txt))queue.push(t)});next()}
// ---------- abas agrupadas no celular ----------
var GROUPS=[['Corrida',['PAINEL','CAMPEONATO','RIVAIS']],['Equipe',['EQUIPE','MERCADO']],['Carro',['CARRO','P&D']],['Negócios',['FINANÇAS']],['Carreira',['DIRETORIA']]];
var curGroup=null;
function label(b){return (b.innerText||'').replace(/[•●]/g,'').trim().toUpperCase()}
function groupTabs(){var nav=document.querySelector('nav.tabs');if(!nav)return;var btns=[].slice.call(nav.querySelectorAll('button'));
 var names=btns.map(label);if(names.indexOf('PAINEL')<0){nav.classList.remove('grouped');var g0=document.getElementById('tab-groups');if(g0)g0.style.display='none';return}
 var bar=document.getElementById('tab-groups');if(!bar||bar.nextElementSibling!==nav){if(bar)bar.remove();bar=document.createElement('div');bar.id='tab-groups';nav.parentNode.insertBefore(bar,nav);
  GROUPS.forEach(function(g){var b=document.createElement('button');b.type='button';b.textContent=g[0];b.addEventListener('click',function(){curGroup=g[0];var first=btns.filter(function(x){return g[1].indexOf(label(x))>=0})[0];var live=[].slice.call(document.querySelectorAll('nav.tabs button')).filter(function(x){return label(x)===(first&&label(first))})[0];if(live)live.click();apply()});bar.appendChild(b)})}
 bar.style.display='';nav.classList.add('grouped');
 var on=btns.filter(function(b){return b.classList.contains('on')})[0],onName=on?label(on):'PAINEL';
 var g=GROUPS.filter(function(g){return g[1].indexOf(onName)>=0})[0];curGroup=g?g[0]:curGroup||'Corrida';apply();
 function apply(){var G=GROUPS.filter(function(x){return x[0]===curGroup})[0]||GROUPS[0];[].slice.call(document.querySelectorAll('nav.tabs button')).forEach(function(b){b.classList.toggle('tab-off',G[1].indexOf(label(b))<0)});[].slice.call(bar.children).forEach(function(c){c.classList.toggle('on',c.textContent===G[0])})}
}
var pending=false;
new MutationObserver(function(){if(pending)return;pending=true;setTimeout(function(){pending=false;groupTabs();scanTips()},250)}).observe(document.body,{childList:true,subtree:true,characterData:true});
setTimeout(function(){groupTabs();scanTips()},800);
})();
</script>


<script>
(function(){
  'use strict';

  // Índices na ordem do array zc (bot0..bot9):
  // 0:Vermelha Corse t8, 1:Prata Motorsport t8, 2:Taurus t7, 3:Laranja t7,
  // 4:Verde Britânia t6, 5:Alpino t5, 6:Falcão t5, 7:Ondina t4, 8:Tucano t3, 9:Brasa t4
  const TEAMS = {
    'facil':         [0,1],
    'medio':         [2,3,4,10],
    'dificil':       [5,6,9],
    'muito-dificil': [7,8]
  };
  const LABELS = {
    'facil':         {icon:'🟢', label:'Fácil',        sub:'Top 1–2'},
    'medio':         {icon:'🔵', label:'Médio',         sub:'Meio de tabela'},
    'dificil':       {icon:'🟡', label:'Difícil',       sub:'Equipe fraca'},
    'muito-dificil': {icon:'🔴', label:'Muito Difícil', sub:'Lanterna'}
  };

  const overlay = document.getElementById('diff-overlay');

  let watching = false;
  let chosenDiff = null;
  let banner = null; // injetado dentro do .newgame.wide

  // Cria o banner e injeta antes do .pitches
  function injectBanner(ng){
    if(ng.querySelector('#diff-banner')) return; // já existe
    banner = document.createElement('div');
    banner.id = 'diff-banner';
    banner.className = 'hidden';
    banner.innerHTML =
      '<div id="diff-banner-info">' +
        '<div id="diff-banner-icon"></div>' +
        '<div id="diff-banner-text">' +
          '<div id="diff-banner-label"></div>' +
          '<div id="diff-banner-sub"></div>' +
        '</div>' +
      '</div>' +
      '<button id="diff-banner-back">← Mudar dificuldade</button>';

    // Insere antes do .pitches (ou no final do .card)
    const card = ng.querySelector('.card');
    const pitches = ng.querySelector('.pitches');
    if(pitches && pitches.parentNode){
      pitches.parentNode.insertBefore(banner, pitches);
    } else if(card){
      card.appendChild(banner);
    }

    banner.querySelector('#diff-banner-back').addEventListener('click', function(){
      chosenDiff = null;
      banner.classList.add('hidden');
      overlay.classList.remove('hidden');
      removePitchFilter(ng);
    });
  }

  // Chama o onClick do React Fiber de um elemento DOM
  function callReactClick(el){
    const key = Object.keys(el).find(function(k){
      return k.startsWith('__reactFiber') || k.startsWith('__reactInternalInstance');
    });
    if(!key) return false;
    let fiber = el[key];
    while(fiber){
      const props = fiber.memoizedProps || fiber.pendingProps;
      if(props && typeof props.onClick === 'function'){
        props.onClick({type:'click',preventDefault:function(){},stopPropagation:function(){}});
        return true;
      }
      fiber = fiber.return;
    }
    return false;
  }

  function applyPitchFilter(ng){
    const pitches = ng.querySelector('.pitches');
    if(!pitches) return;
    const allowed = new Set(TEAMS[chosenDiff]);
    const btns = Array.from(pitches.querySelectorAll('button'));

    // Encontra o índice correto e o botão permitido
    var firstBtn = null;
    var firstIdx = -1;
    for(var i = 0; i < btns.length; i++){
      if(allowed.has(i)){
        firstBtn = btns[i];
        firstIdx = i;
        break;
      }
    }

    // Sincroniza o estado do React clicando no primeiro botão permitido
    // ANTES de esconder os outros (enquanto todos ainda estão visíveis)
    if(firstBtn){
      var clicked = callReactClick(firstBtn);
      if(!clicked){
        firstBtn.dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true}));
      }
    }

    // Esconde pitches fora do tier após sincronizar o estado
    setTimeout(function(){
      btns.forEach(function(b, i){
        b.classList.toggle('pitch-hidden', !allowed.has(i));
      });
    }, 30);
  }

  function removePitchFilter(ng){
    const pitches = ng && ng.querySelector('.pitches');
    if(pitches) pitches.querySelectorAll('button').forEach(function(b){ b.classList.remove('pitch-hidden'); });
  }

  function showBanner(ng){
    const l = LABELS[chosenDiff];
    injectBanner(ng);
    const b = ng.querySelector('#diff-banner');
    ng.querySelector('#diff-banner-icon').textContent  = l.icon;
    ng.querySelector('#diff-banner-label').textContent = l.label + ' · ' + l.sub;
    ng.querySelector('#diff-banner-sub').textContent   = 'Escolha uma das equipes abaixo e clique em Assumir.';
    b.classList.remove('hidden');
  }

  function onNewGameAppear(){
    if(watching) return;
    watching = true;
    chosenDiff = null;
    overlay.classList.remove('hidden');
  }

  function onNewGameGone(){
    watching = false;
    chosenDiff = null;
    banner = null;
    overlay.classList.add('hidden');
  }

  overlay.addEventListener('click', function(e){
    const btn = e.target.closest('[data-diff]');
    if(!btn) return;
    chosenDiff = btn.dataset.diff;
    overlay.classList.add('hidden');

    setTimeout(function(){
      const ng = document.querySelector('.newgame.wide');
      if(!ng) return;
      showBanner(ng);
      applyPitchFilter(ng);
    }, 50);
  });

  new MutationObserver(function(){
    const ng = document.querySelector('.newgame.wide');
    if(ng && !watching) onNewGameAppear();
    else if(!ng && watching) onNewGameGone();
  }).observe(document.body, {childList:true, subtree:true});

  setTimeout(function(){
    if(document.querySelector('.newgame.wide')) onNewGameAppear();
  }, 300);
})();
</script>
